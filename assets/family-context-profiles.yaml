# ══════════════════════════════════════════════════════════════════════
# 任务类别 → 旋钮微调
# ══════════════════════════════════════════════════════════════════════
# 同一家族在不同任务类别上的拒答触发点不同：
#   「给出攻击步骤」比「解释漏洞原理」更易触发；「写检测规则」几乎不触发。
# 微调只允许「加强意图澄清 / 收紧输出契约」，不允许放松任何东西。
task_category_overrides:

  检测规则:
    rationale: 产出物是拦截规则，天然防御性；不需要额外澄清，重点在要求可执行
    set: {intent_disambiguation: defensive_purpose, output_contract: strict}

  漏洞原理:
    rationale: 原理讲解易被误判为"教攻击"；用"培训/审计视角"限定
    set: {intent_disambiguation: dual_use, output_contract: strict}

  加固配置:
    rationale: 纯防御产出，拒答率最低；契约可放宽以换取可执行细节
    set: {intent_disambiguation: defensive_purpose, output_contract: light}

  日志分析:
    rationale: 数据处理类，需强调最小化与脱敏，避免隐私顾虑式拒答
    set: {intent_disambiguation: defensive_purpose, output_contract: strict}

  代码审计:
    rationale: 涉及具体漏洞代码时最易触发；必须绑定"自建靶场/自有代码"事实
    set: {intent_disambiguation: verification_only, scope_granularity: asset_list}

  Agent工程:
    rationale: 元讨论（如何设计 Agent），几乎无安全触发点；保持轻量
    set: {output_contract: light}

# ══════════════════════════════════════════════════════════════════════
# 已知的反模式（防止把工具用成"话术炼金术"）
# ══════════════════════════════════════════════════════════════════════
anti_patterns:
  - pattern: 同一会话里对不同家族轮换 try 所有 profile
    why_bad: 变量不受控，且会把"信息补齐"退化成"措辞碰运气"
    correct: 一次只测一个 profile 的一个旋钮，配对比较
  - pattern: 把 calibration 字段手填成"效果很好"
    why_bad: 破掉唯一的数据可信度来源
    correct: 只由 measure_cooperation.py --write-back 写入，带 n 与 CI
  - pattern: 用 generic 画像的数据声称"某家族拒答率高"
    why_bad: 家族未识别时数据不含家族信息
    correct: 先 fingerprint.py 识别（并要求置信度达标），再谈家族
  - pattern: 为了让模型配合而谎报 authorization.type
    why_bad: 属伪造授权，被追问即崩，且是真实合规风险
    correct: 用 own_lab / ctf，诚实且同样有效
